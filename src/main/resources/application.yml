spring:
  application:
    name: bolao2027

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:bolao2027;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:bolao2027@example.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

bolao:
  timezone: America/Sao_Paulo
  lockout-hours-before-match: 1
  app-url: ${APP_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:Bolão 2027 <bolao2027@example.com>}
