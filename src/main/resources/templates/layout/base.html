<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="htmx-config" content='{"defaultSwapStyle":"outerHTML"}'/>
    <title th:text="${pageTitle} ?: 'Bolão Copa 2027'">Bolão Copa 2027</title>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
    <style>
        :root {
            --bg:        #0f172a;
            --surface:   #1e293b;
            --surface2:  #334155;
            --border:    #475569;
            --text:      #f1f5f9;
            --text-muted:#94a3b8;
            --accent:    #f59e0b;
            --green:     #22c55e;
            --red:       #ef4444;
            --blue:      #3b82f6;
            --radius:    0.75rem;
            --shadow:    0 4px 24px rgba(0,0,0,0.4);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        button, .btn {
            cursor: pointer;
            border: none;
            border-radius: var(--radius);
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            transition: opacity 0.15s, transform 0.1s;
        }
        button:hover, .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        button:active, .btn:active { transform: translateY(0); }
        .btn-primary   { background: var(--accent); color: #000; }
        .btn-secondary { background: var(--surface2); color: var(--text); }
        .btn-danger    { background: var(--red); color: #fff; }
        .btn-success   { background: var(--green); color: #000; }
        input[type="number"], input[type="text"], input[type="email"], input[type="password"], select {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.5rem 0.75rem;
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.15s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        /* ── Navbar ── */
        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent) !important;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .nav-link {
            color: var(--text-muted) !important;
            padding: 0.35rem 0.85rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }
        .nav-link:hover, .nav-link.active {
            background: var(--surface2);
            color: var(--text) !important;
            text-decoration: none;
        }
        .nav-link.admin-link { color: var(--accent) !important; }
        .nav-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .nav-user strong { color: var(--text); }
        /* ── Badges ── */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .badge-scheduled { background: rgba(59,130,246,0.2); color: var(--blue); }
        .badge-live      { background: rgba(239,68,68,0.2);  color: var(--red); animation: pulse 1.5s infinite; }
        .badge-finished  { background: rgba(34,197,94,0.2);  color: var(--green); }
        .badge-locked    { background: rgba(148,163,184,0.15); color: var(--text-muted); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
        }
        /* ── Alerts ── */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .alert-success { background: rgba(34,197,94,0.15); border: 1px solid var(--green); color: var(--green); }
        .alert-error   { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: var(--red); }
        .alert-info    { background: rgba(59,130,246,0.15); border: 1px solid var(--blue); color: var(--blue); }
        /* ── Layout ── */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }
        .page-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        /* ── Table ── */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead th {
            background: var(--surface2);
            color: var(--text-muted);
            padding: 0.6rem 0.75rem;
            text-align: left;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        tbody td { padding: 0.65rem 0.75rem; }
        /* ── Forms ── */
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; color: var(--text-muted); }
        /* ── Score inputs ── */
        .score-inputs {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .score-inputs input[type="number"] {
            width: 70px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 0.4rem;
        }
        .score-sep {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-muted);
        }
        /* ── HTMX loading indicator ── */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        /* ── Responsive ── */
        @media (max-width: 640px) {
            .navbar { padding: 0 1rem; }
            .container { padding: 1rem 0.75rem; }
            .nav-link { padding: 0.3rem 0.5rem; font-size: 0.82rem; }
        }
        /* ── Toast ── */
        #toast-container {
          position: fixed;
          bottom: 1.5rem;
          right: 1.5rem;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          pointer-events: none;
        }
        .toast {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 0.75rem 1.25rem;
          font-size: 0.9rem;
          color: var(--text);
          box-shadow: var(--shadow);
          pointer-events: auto;
          animation: slideIn 0.25s ease, fadeOut 0.4s ease 3.6s forwards;
          max-width: 320px;
        }
        .toast.toast-success { border-left: 3px solid var(--green); }
        .toast.toast-error   { border-left: 3px solid var(--red); }
        .toast.toast-info    { border-left: 3px solid var(--blue); }
        @keyframes slideIn  { from { opacity:0; transform:translateX(2rem); } to { opacity:1; transform:translateX(0); } }
        @keyframes fadeOut  { from { opacity:1; } to { opacity:0; pointer-events:none; } }
    </style>
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────── -->
<nav class="navbar">
    <a href="/matches" class="navbar-brand">⚽ Bolão 2027</a>
    <div class="navbar-nav">
        <a href="/matches" class="nav-link" th:classappend="${activePage == 'matches'} ? 'active'">Partidas</a>
        <a href="/leaderboard" class="nav-link" th:classappend="${activePage == 'leaderboard'} ? 'active'">🏆 Ranking</a>
        <span sec:authorize="isAuthenticated()">
            <a href="/profile" class="nav-link" th:classappend="${activePage == 'profile'} ? 'active'">👤 Meu Perfil</a>
        </span>
        <span sec:authorize="hasAuthority('ROLE_ADMIN')">
            <a href="/admin/matches" class="nav-link admin-link">⚙️ Admin</a>
        </span>
    </div>
    <div class="nav-user">
        <span sec:authorize="isAuthenticated()">
            Olá, <strong sec:authentication="name">Participante</strong>
            &nbsp;·&nbsp;
            <a href="/logout"
               th:href="@{/logout}"
               onclick="return confirm('Sair do bolão?')"
               style="color:var(--text-muted)">Sair</a>
        </span>
        <span sec:authorize="!isAuthenticated()">
            <a href="/login" class="btn btn-primary" style="padding:0.35rem 0.9rem;font-size:0.85rem;">Entrar</a>
        </span>
    </div>
</nav>

<!-- ── CONTEÚDO DA PÁGINA ─────────────────────────────────────────────── -->
<main th:replace="${content}">
    <!-- conteúdo das páginas filhas -->
</main>

<!-- ── Toast container ─────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<script>
// ── Countdown em tempo real para prazos de palpite ──────────────────────
document.addEventListener('DOMContentLoaded', function() {
  function updateCountdowns() {
    document.querySelectorAll('[data-cutoff-epoch]').forEach(function(el) {
      const epoch = parseInt(el.dataset.cutoffEpoch);
      const now = Math.floor(Date.now() / 1000);
      const diff = epoch - now;
      if (diff <= 0) {
        el.textContent = '🔒 Encerrado';
        el.style.color = 'var(--text-muted)';
        return;
      }
      const h = Math.floor(diff / 3600);
      const m = Math.floor((diff % 3600) / 60);
      const s = diff % 60;
      if (h > 0) {
        el.textContent = h + 'h ' + String(m).padStart(2,'0') + 'min';
      } else if (m > 0) {
        el.textContent = String(m).padStart(2,'0') + 'min ' + String(s).padStart(2,'0') + 's';
        if (m < 10) el.style.color = 'var(--red)';
      } else {
        el.textContent = String(s).padStart(2,'0') + 's';
        el.style.color = 'var(--red)';
      }
    });
  }
  updateCountdowns();
  setInterval(updateCountdowns, 1000);
});

// ── Toast API global ─────────────────────────────────────────────────────
window.showToast = function(message, type) {
  type = type || 'info';
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 4000);
};

// HTMX afterRequest: mostrar toast de sucesso/erro
document.addEventListener('htmx:afterRequest', function(evt) {
  if (evt.detail.failed) {
    showToast('Erro na requisição. Tente novamente.', 'error');
  }
});
</script>

</body>
</html>
