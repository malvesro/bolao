<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Fragmento: table
    Parâmetros esperados no model:
      - entries         : List<RankingEntry>  — página atual (já paginada no controller)
      - currentUserId   : Long
      - currentUserEntry: RankingEntry        — posição do usuário logado (pode ser null)
      - currentPage     : int                 — página atual (0-indexed)
      - totalPages      : int                 — total de páginas
      - pageSize        : int                 — tamanho da página
      - totalEntries    : int                 — total de participantes no ranking
      - selectedRound   : Integer             — rodada filtrada (null = geral)
-->
<th:block th:fragment="table">

    <!-- Estado vazio -->
    <div th:if="${entries == null or entries.isEmpty()}"
         style="text-align:center; padding:4rem 1rem; color:var(--text-muted);">
        <div style="font-size:3rem; margin-bottom:0.75rem;">🏆</div>
        <p>Nenhum palpite registrado ainda. O ranking aparecerá assim que as partidas forem apuradas.</p>
    </div>

    <!-- Destaque do usuário atual (acima da tabela, visível no mobile) -->
    <div th:if="${entries != null and !entries.isEmpty() and currentUserEntry != null}"
         style="margin-bottom:1rem;">
        <div style="background:rgba(245,158,11,0.12); border:1px solid var(--accent);
                    border-radius:var(--radius); padding:0.75rem 1rem;
                    display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
            <span style="font-size:1.1rem; font-weight:800; color:var(--accent);"
                  th:text="${currentUserEntry.position + 'º'}">Nº</span>
            <span style="font-weight:700; flex:1;" th:text="${currentUserEntry.displayName}">Você</span>
            <span class="badge badge-scheduled"
                  th:text="${currentUserEntry.totalPoints + ' pts'}">0 pts</span>
            <span style="font-size:0.8rem; color:var(--text-muted);">Sua posição atual</span>
        </div>
    </div>

    <!-- Tabela principal -->
    <div th:if="${entries != null and !entries.isEmpty()}"
         style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th style="width:50px; text-align:center;">Pos</th>
                    <th>Participante</th>
                    <th style="text-align:center;">Pontos</th>
                    <th style="text-align:center; white-space:nowrap;">🎯 Exatos</th>
                    <th style="text-align:center; white-space:nowrap;">✅ Parciais</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${entries}"
                    th:style="${entry.userId == currentUserId}
                              ? 'background:rgba(245,158,11,0.10); border-left:3px solid var(--accent);'
                              : ''">

                    <!-- Posição com medalha e empate -->
                    <td style="text-align:center; font-weight:700; font-size:1rem;">
                        <span th:if="${entry.position == 1}">🥇</span>
                        <span th:if="${entry.position == 2}">🥈</span>
                        <span th:if="${entry.position == 3}">🥉</span>
                        <span th:if="${entry.position > 3}"
                              th:text="${entry.position + 'º'}"
                              style="color:var(--text-muted); font-size:0.9rem;"></span>
                    </td>

                    <!-- Nome do participante -->
                    <td>
                        <span th:text="${entry.displayName}">Participante</span>
                        <!-- Indicador "Você" -->
                        <span th:if="${entry.userId == currentUserId}"
                              style="margin-left:0.4rem; font-size:0.72rem; font-weight:700;
                                     background:var(--accent); color:#000;
                                     padding:0.1rem 0.45rem; border-radius:99px; vertical-align:middle;">
                            Você
                        </span>
                        <!-- Indicador de empate: mesmo position que o anterior -->
                        <span th:if="${entryStat.index > 0 and entries[entryStat.index - 1].position == entry.position}"
                              style="margin-left:0.4rem; font-size:0.72rem; color:var(--text-muted);">
                            (empate)
                        </span>
                    </td>

                    <!-- Pontuação total -->
                    <td style="text-align:center;">
                        <strong th:text="${entry.totalPoints}"
                                th:style="${entry.userId == currentUserId}
                                          ? 'color:var(--accent); font-size:1.05rem;'
                                          : 'font-size:1.05rem;'">0</strong>
                    </td>

                    <!-- Exatos (6 pts cada) -->
                    <td style="text-align:center;">
                        <span class="badge badge-finished"
                              th:text="${entry.exactScoreCount}">0</span>
                    </td>

                    <!-- Parciais (3 pts cada) -->
                    <td style="text-align:center;">
                        <span class="badge badge-scheduled"
                              th:text="${entry.partialScoreCount}">0</span>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

    <!-- Rodapé com info de paginação (usado quando o fragment é renderizado via HTMX) -->
    <div th:if="${entries != null and !entries.isEmpty()}"
         style="margin-top:0.75rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">

        <!-- Total de participantes e filtro ativo -->
        <span style="font-size:0.78rem; color:var(--text-muted);">
            <span th:text="${totalEntries}">0</span> participante(s) no ranking
            <span th:if="${selectedRound != null}">
                · Rodada <span th:text="${selectedRound}"></span>
            </span>
        </span>

        <!-- Indicador de página atual (para o polling HTMX saber em qual página está) -->
        <span th:if="${totalPages > 1}"
              style="font-size:0.78rem; color:var(--text-muted);">
            Página <span th:text="${currentPage + 1}">1</span> de <span th:text="${totalPages}">1</span>
        </span>

    </div>

</th:block>

</body>
</html>
