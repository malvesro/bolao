<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Entrar — Bolão Copa 2027</title>
    <style>
        :root {
            --bg:        #0f172a;
            --surface:   #1e293b;
            --surface2:  #334155;
            --border:    #475569;
            --text:      #f1f5f9;
            --text-muted:#94a3b8;
            --accent:    #f59e0b;
            --green:     #22c55e;
            --red:       #ef4444;
            --radius:    0.75rem;
            --shadow:    0 4px 24px rgba(0,0,0,0.4);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo .emoji {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .login-logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }
        input[type="text"],
        input[type="password"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.6rem 0.85rem;
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: opacity 0.15s, transform 0.1s;
            letter-spacing: 0.01em;
        }
        .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }

        .alert-error {
            background: rgba(239,68,68,0.12);
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 0.5rem;
            padding: 0.6rem 0.85rem;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
        <span class="emoji">⚽</span>
        <h1>Bolão 2027</h1>
        <p>Copa do Mundo Feminina</p>
    </div>

    <!-- Erro de autenticação -->
    <div th:if="${param.error}" class="alert-error">
        <span>⚠️</span>
        <span>Usuário ou senha incorretos. Tente novamente.</span>
    </div>

    <!-- Mensagem de logout bem-sucedido -->
    <div th:if="${param.logout}"
         style="background:rgba(34,197,94,0.12); border:1px solid var(--green); color:var(--green);
                border-radius:0.5rem; padding:0.6rem 0.85rem; font-size:0.88rem;
                margin-bottom:1.25rem; display:flex; align-items:center; gap:0.5rem;">
        <span>✅</span> <span>Você saiu com sucesso.</span>
    </div>

    <!-- Mensagem de cadastro bem-sucedido -->
    <div th:if="${param.registered}"
         style="background:rgba(34,197,94,0.12); border:1px solid var(--green); color:var(--green);
                border-radius:0.5rem; padding:0.6rem 0.85rem; font-size:0.88rem;
                margin-bottom:1.25rem; display:flex; align-items:center; gap:0.5rem;">
        <span>🎉</span> <span>Conta criada com sucesso! Faça login para entrar.</span>
    </div>

    <!-- Mensagem de senha redefinida com sucesso -->
    <div th:if="${param.passwordReset}"
         style="background:rgba(34,197,94,0.12); border:1px solid var(--green); color:var(--green);
                border-radius:0.5rem; padding:0.6rem 0.85rem; font-size:0.88rem;
                margin-bottom:1.25rem; display:flex; align-items:center; gap:0.5rem;">
        <span>✅</span> <span>Senha redefinida com sucesso! Faça login com sua nova senha.</span>
    </div>

    <!-- Formulário de login -->
    <form method="post" th:action="@{/login}">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label class="form-label" for="username">Usuário</label>
            <input type="text" id="username" name="username"
                   placeholder="Seu nome de usuário"
                   autocomplete="username"
                   autocapitalize="none"
                   autofocus
                   required/>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <input type="password" id="password" name="password"
                   placeholder="Sua senha"
                   autocomplete="current-password"
                   required/>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>

    </form>

    <!-- Link de recuperação de senha -->
    <p style="text-align:center; margin-top:1rem; font-size:0.85rem;">
        <a href="/forgot-password" style="color:var(--text-muted)">Esqueceu sua senha?</a>
    </p>

    <!-- Link de registro -->
    <div class="footer-link">
        Não tem conta?
        <a href="/register">Criar conta</a>
    </div>

</div>

</body>
</html>
