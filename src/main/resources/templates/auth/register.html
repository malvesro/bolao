<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Criar Conta — Bolão Copa 2027</title>
    <style>
        :root {
            --bg:        #0f172a;
            --surface:   #1e293b;
            --surface2:  #334155;
            --border:    #475569;
            --text:      #f1f5f9;
            --text-muted:#94a3b8;
            --accent:    #f59e0b;
            --green:     #22c55e;
            --red:       #ef4444;
            --radius:    0.75rem;
            --shadow:    0 4px 24px rgba(0,0,0,0.4);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .register-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }

        .register-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-logo .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .register-logo h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .register-logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }
        .form-hint {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.6rem 0.85rem;
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        input.input-error {
            border-color: var(--red);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: opacity 0.15s, transform 0.1s;
            letter-spacing: 0.01em;
        }
        .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }

        .alert-error {
            background: rgba(239,68,68,0.12);
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 0.5rem;
            padding: 0.65rem 0.85rem;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Validação client-side */
        input:invalid:not(:placeholder-shown) {
            border-color: var(--red);
        }
        input:valid:not(:placeholder-shown) {
            border-color: var(--green);
        }
    </style>
</head>
<body>

<div class="register-card">

    <!-- Logo -->
    <div class="register-logo">
        <span class="emoji">⚽</span>
        <h1>Criar Conta</h1>
        <p>Bolão Copa do Mundo Feminina 2027</p>
    </div>

    <!-- Erro do servidor -->
    <div th:if="${errorMessage}" class="alert-error">
        <span>⚠️</span>
        <span th:text="${errorMessage}">Erro ao criar conta.</span>
    </div>

    <!-- Formulário de registro -->
    <form method="post" th:action="@{/register}"
          novalidate
          onsubmit="return validateRegisterForm(this)">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Username -->
        <div class="form-group">
            <label class="form-label" for="username">Nome de usuário</label>
            <input type="text" id="username" name="username"
                   th:value="${formData?.username}"
                   placeholder="Apenas letras, números e _"
                   autocomplete="username"
                   autocapitalize="none"
                   pattern="[a-zA-Z0-9_]{3,30}"
                   minlength="3" maxlength="30"
                   autofocus
                   required/>
            <span class="form-hint">3–30 caracteres. Letras, números e underscore.</span>
        </div>

        <!-- Nome de exibição -->
        <div class="form-group">
            <label class="form-label" for="displayName">Nome de exibição</label>
            <input type="text" id="displayName" name="displayName"
                   th:value="${formData?.displayName}"
                   placeholder="Como você quer aparecer no ranking"
                   autocomplete="nickname"
                   minlength="2" maxlength="50"
                   required/>
            <span class="form-hint">Este nome aparecerá na tabela de ranking.</span>
        </div>

        <!-- E-mail -->
        <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   th:value="${formData?.email}"
                   placeholder="seu@email.com"
                   autocomplete="email"
                   required/>
        </div>

        <!-- Senha -->
        <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <input type="password" id="password" name="password"
                   placeholder="Mínimo 6 caracteres"
                   autocomplete="new-password"
                   minlength="6"
                   required/>
        </div>

        <!-- Confirmar senha -->
        <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirmar senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Repita a senha"
                   autocomplete="new-password"
                   minlength="6"
                   required/>
        </div>

        <button type="submit" class="btn-submit">Criar Conta</button>

    </form>

    <!-- Link de login -->
    <div class="footer-link">
        Já tem conta?
        <a href="/login">Entrar</a>
    </div>

</div>

<script>
    function validateRegisterForm(form) {
        const password = form.password.value;
        const confirm  = form.confirmPassword.value;

        if (password.length < 6) {
            alert('A senha deve ter pelo menos 6 caracteres.');
            form.password.focus();
            return false;
        }

        if (password !== confirm) {
            alert('As senhas não coincidem. Verifique e tente novamente.');
            form.confirmPassword.focus();
            form.confirmPassword.style.borderColor = 'var(--red)';
            return false;
        }

        const username = form.username.value;
        if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) {
            alert('Nome de usuário inválido. Use apenas letras, números e _.');
            form.username.focus();
            return false;
        }

        return true;
    }

    // Limpa o estilo de erro ao digitar na confirmação de senha
    document.getElementById('confirmPassword').addEventListener('input', function () {
        this.style.borderColor = '';
    });
</script>

</body>
</html>
