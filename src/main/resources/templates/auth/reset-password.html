<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nova Senha — Bolão Copa 2027</title>
    <style>
        :root {
            --bg:         #0f172a;
            --surface:    #1e293b;
            --surface2:   #334155;
            --border:     #475569;
            --text:       #f1f5f9;
            --text-muted: #94a3b8;
            --accent:     #f59e0b;
            --green:      #22c55e;
            --red:        #ef4444;
            --radius:     0.75rem;
            --shadow:     0 4px 24px rgba(0,0,0,0.4);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }

        .card-logo {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .card-logo .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .card-logo h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .card-logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .alert-error {
            background: rgba(239,68,68,0.12);
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 0.5rem;
            padding: 0.65rem 0.9rem;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            line-height: 1.5;
        }

        /* Token inválido / ausente */
        .alert-warning {
            background: rgba(245,158,11,0.12);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 0.5rem;
            padding: 0.65rem 0.9rem;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.1rem;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }
        input[type="password"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.6rem 0.85rem;
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.15s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        input[type="password"].input-error {
            border-color: var(--red);
        }
        input[type="password"]::placeholder {
            color: var(--border);
        }

        .field-hint {
            font-size: 0.78rem;
            color: var(--red);
            margin-top: 0.3rem;
            display: none;
        }
        .field-hint.visible {
            display: block;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: opacity 0.15s, transform 0.1s;
            letter-spacing: 0.01em;
        }
        .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Logo -->
    <div class="card-logo">
        <span class="emoji">🔑</span>
        <h1>Nova senha</h1>
        <p>Bolão Copa do Mundo Feminina 2027</p>
    </div>

    <!-- Aviso: token ausente na URL -->
    <div th:if="${token == null or token.isBlank()}" class="alert-warning">
        ⚠️ Link inválido ou expirado. Solicite uma nova recuperação de senha.
    </div>

    <!-- Erro do servidor (token expirado, já usado, senhas divergentes etc.) -->
    <div th:if="${errorMessage}" class="alert-error">
        <span>⚠️</span>
        <span th:text="${errorMessage}">Erro ao redefinir senha.</span>
    </div>

    <!-- Formulário (exibido apenas quando há token) -->
    <form th:if="${token != null and !token.isBlank()}"
          id="resetForm"
          method="post"
          th:action="@{/reset-password}"
          onsubmit="return validatePasswords(event)">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <!-- Token de recuperação -->
        <input type="hidden" name="token" th:value="${token}"/>

        <div class="form-group">
            <label class="form-label" for="newPassword">Nova senha</label>
            <input type="password"
                   id="newPassword"
                   name="newPassword"
                   placeholder="Mínimo 8 caracteres"
                   minlength="8"
                   autocomplete="new-password"
                   autofocus
                   required
                   oninput="checkMatch()"/>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirmar nova senha</label>
            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Repita a nova senha"
                   minlength="8"
                   autocomplete="new-password"
                   required
                   oninput="checkMatch()"/>
            <span id="matchHint" class="field-hint">As senhas não conferem.</span>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Salvar nova senha</button>
    </form>

    <!-- Link de volta ao login -->
    <div class="footer-link">
        <a href="/login">← Voltar ao login</a>
    </div>

</div>

<script>
    /**
     * Verifica em tempo real se as senhas digitadas coincidem e
     * habilita/desabilita o botão de envio de forma responsiva.
     */
    function checkMatch() {
        var pw  = document.getElementById('newPassword');
        var cpw = document.getElementById('confirmPassword');
        var hint = document.getElementById('matchHint');
        var btn  = document.getElementById('submitBtn');

        if (!pw || !cpw) return;

        var mismatch = cpw.value.length > 0 && pw.value !== cpw.value;

        cpw.classList.toggle('input-error', mismatch);
        hint.classList.toggle('visible', mismatch);
        if (btn) btn.disabled = mismatch;
    }

    /**
     * Validação final antes do submit: garante que as senhas coincidem
     * mesmo que o usuário tenha desabilitado JS ou o oninput não tenha disparado.
     */
    function validatePasswords(event) {
        var pw  = document.getElementById('newPassword');
        var cpw = document.getElementById('confirmPassword');

        if (pw.value !== cpw.value) {
            event.preventDefault();
            cpw.classList.add('input-error');
            document.getElementById('matchHint').classList.add('visible');
            cpw.focus();
            return false;
        }
        return true;
    }
</script>

</body>
</html>
