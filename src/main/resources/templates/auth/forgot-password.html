<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recuperar Senha — Bolão Copa 2027</title>
    <style>
        :root {
            --bg:         #0f172a;
            --surface:    #1e293b;
            --surface2:   #334155;
            --border:     #475569;
            --text:       #f1f5f9;
            --text-muted: #94a3b8;
            --accent:     #f59e0b;
            --green:      #22c55e;
            --red:        #ef4444;
            --radius:     0.75rem;
            --shadow:     0 4px 24px rgba(0,0,0,0.4);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }

        .card-logo {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .card-logo .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .card-logo h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .card-logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .alert-success {
            background: rgba(34,197,94,0.12);
            border: 1px solid var(--green);
            color: var(--green);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            line-height: 1.5;
        }

        .description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.55;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }
        input[type="email"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.6rem 0.85rem;
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.15s;
        }
        input[type="email"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        input[type="email"]::placeholder {
            color: var(--border);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: opacity 0.15s, transform 0.1s;
            letter-spacing: 0.01em;
        }
        .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Logo -->
    <div class="card-logo">
        <span class="emoji">🔑</span>
        <h1>Recuperar senha</h1>
        <p>Bolão Copa do Mundo Feminina 2027</p>
    </div>

    <!-- Mensagem de sucesso (parâmetro ?sent presente) -->
    <div th:if="${param.sent}" class="alert-success">
        <span>✅</span>
        <span>Se o e-mail estiver cadastrado, você receberá as instruções em breve.
              Verifique também sua pasta de spam.</span>
    </div>

    <!-- Formulário (oculto após envio para evitar reenvio acidental) -->
    <div th:unless="${param.sent}">
        <p class="description">
            Informe o e-mail cadastrado na sua conta e enviaremos um link para redefinir sua senha.
        </p>

        <form method="post" th:action="@{/forgot-password}">
            <!-- CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label" for="email">E-mail</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="seu@email.com"
                       autocomplete="email"
                       autofocus
                       required/>
            </div>

            <button type="submit" class="btn-submit">Enviar instruções</button>
        </form>
    </div>

    <!-- Link de volta ao login -->
    <div class="footer-link">
        <a href="/login">← Voltar ao login</a>
    </div>

</div>

</body>
</html>
